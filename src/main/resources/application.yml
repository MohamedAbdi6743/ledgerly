spring:
  application:
    name: Ledgerly

  # Load local settings (database password etc.) from the .env file if it exists.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5441/ledgerly}
    username: ${DB_USERNAME:ledgerly}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # Flyway creates and changes tables. Hibernate only checks they match our entities.
      ddl-auto: validate
    # Keep database work inside the service layer instead of during JSON rendering.
    open-in-view: false
    properties:
      hibernate:
        # Money events are stored as exact moments (TIMESTAMPTZ). Talk to the database in UTC
        # so the result never depends on the server's own time zone.
        jdbc:
          time_zone: UTC

server:
  port: ${APP_PORT:8080}

ledgerly:
  # The first manager, created at startup if this email doesn't exist yet.
  admin:
    email: ${LEDGERLY_ADMIN_EMAIL:}
    password: ${LEDGERLY_ADMIN_PASSWORD:}
    name: ${LEDGERLY_ADMIN_NAME:Branch Manager}

  # "Today" for the daily transfer limit means today in the credit union's own time zone.
  time-zone: America/Toronto
  transfers:
    # Most a member can send per day to accounts they don't own. Their own accounts don't count.
    daily-limit: 3000.00
  approvals:
    # Withdrawals and transfers to someone else of this much or more wait for a manager.
    threshold: 5000.00
