# Runs on every push to main and every pull request: builds the app and runs all tests.
# GitHub's Ubuntu runners have Docker, so Testcontainers can start PostgreSQL for the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B verify
